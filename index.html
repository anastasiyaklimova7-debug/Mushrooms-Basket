html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:700;font-size:16px;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

.scene{
  min-height:100%;
  background:var(--bg) var(--img-bg) center bottom / cover no-repeat;
  padding-block:12px;
  padding-inline:16px;
  overflow-x:clip;
  position:relative;
  user-select:none;-webkit-user-select:none;
}
.wrap{max-width:1120px;margin-inline:auto;min-height:calc(100vh - 24px);min-height:calc(100dvh - 24px);display:flex;flex-direction:column;gap:10px}

/* HUD */
.hud{
  display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px 16px;
  background:rgba(255,246,224,.9);border:2px solid rgba(122,74,43,.28);border-radius:18px;padding:10px 14px;
}
.title{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;letter-spacing:.01em}
.progress{display:flex;align-items:center;gap:10px;min-width:0}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(122,74,43,.18);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:99px;transition:width .4s ease}
.stat{font-family:var(--f-display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{font-weight:700}
.tools{display:flex;gap:6px}
.chip{
  font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1;
  background:var(--paper);border:2px solid var(--ink-soft);border-radius:999px;padding:7px 12px;cursor:pointer;
}
.chip:hover{background:#ffeec2}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--ink)}
.chip:focus-visible,.basket:focus-visible,.mush:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.help{
  align-self:center;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;
  background:var(--paper);border:2px solid var(--ink-soft);border-radius:16px;padding:10px 16px;
  font-family:var(--f-display);font-weight:700;font-size:18px;
}
.help span{white-space:nowrap}
.help em{font-style:normal;color:var(--berry);font-weight:700}

.status-row{display:flex;justify-content:center;min-height:40px}
.status{
  margin:0;align-self:center;background:rgba(255,246,224,.94);border:2px solid transparent;border-radius:999px;
  padding:6px 16px;font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;
}
.status.good{border-color:var(--leaf);color:var(--leaf)}
.status.bad{border-color:var(--berry);color:var(--berry)}

/* Mushroom floor */
.floor{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,200px));justify-content:center;align-content:end;gap:6px 2px;padding-block:6px;margin-inline:-8px}
@media (min-width:760px){.floor{grid-template-columns:repeat(6,minmax(0,190px));gap:10px 8px;margin-inline:0}}
.slot{position:relative;aspect-ratio:1/1;width:100%}
.slot::after{content:"";position:absolute;left:12%;right:12%;bottom:-2%;height:9%;border-radius:50%;background:radial-gradient(closest-side,rgba(74,36,16,.3),transparent);pointer-events:none}
.slot:empty::after{display:none}

.mush{
  position:absolute;inset:0;z-index:2;container-type:inline-size;cursor:grab;touch-action:none;outline-offset:2px;
  --dx:0px;--dy:0px;--rot:0deg;--s:1;
  transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(var(--s));
  filter:drop-shadow(0 5px 4px rgba(74,36,16,.3));
}
.mush .art{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:contain;pointer-events:none}
.k-red .art{background-image:var(--img-red)}
.k-brown .art{background-image:var(--img-brown)}
.k-chan .art{background-image:var(--img-chan)}
.word{
  position:absolute;transform:translate(-50%,-50%);text-align:center;line-height:1;pointer-events:none;
  font-family:var(--f-display);font-weight:700;color:var(--ink);
  font-size:17px;font-size:var(--fs,18cqw);
  -webkit-text-stroke:.2em rgba(255,246,224,.92);paint-order:stroke fill;
}
.k-red .word,.k-brown .word{left:50%;top:73%;width:54%}
.k-chan .word{left:52%;top:47%;width:48%;--k:.92}
.w1{--fs:calc(19cqw*var(--k,1))}
.w2{--fs:calc(15.5cqw*var(--k,1))}
.w3{--fs:calc(12cqw*var(--k,1))}
.w4{--fs:calc(10.5cqw*var(--k,1))}

.mush.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
.mush:not(.dragging):not(.done):hover{--s:1.05}
.mush.selected{--s:1.1;filter:drop-shadow(0 0 0 var(--gold)) drop-shadow(0 0 10px var(--gold)) drop-shadow(0 6px 4px rgba(74,36,16,.3))}
.mush.dragging{z-index:100;cursor:grabbing;--s:1.14;transition:none;filter:drop-shadow(0 14px 10px rgba(74,36,16,.35))}
.mush.returning{z-index:100;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.mush.done{z-index:100;pointer-events:none;opacity:0;transition:transform .5s cubic-bezier(.5,0,.8,.6),opacity .45s ease .1s}

/* Baskets */
.baskets{display:flex;gap:8px;justify-content:center;align-items:flex-start;padding-bottom:6px;margin-top:clamp(12px,3.5vh,56px);margin-inline:-10px}
.basket{
  position:relative;flex:1 1 0;min-width:0;max-width:300px;background:none;border:0;padding:0;cursor:pointer;container-type:inline-size;
  transition:transform .2s cubic-bezier(.3,1.5,.5,1);
}
.basket .art{display:block;width:100%;aspect-ratio:537/560;background:var(--img-basket) center/contain no-repeat;filter:drop-shadow(0 6px 5px rgba(74,36,16,.3))}
.tag{
  position:absolute;left:50%;top:64%;transform:translate(-50%,-50%);
  background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:.04em .45em .1em;
  font-family:var(--f-display);font-weight:700;font-size:28px;font-size:26cqw;line-height:1.1;color:var(--ink);
  box-shadow:0 3px 0 rgba(74,36,16,.35);
}
.count{
  position:absolute;right:5%;top:42%;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:var(--leaf);color:#fff;
  font-family:var(--f-display);font-weight:700;font-size:15px;display:grid;place-items:center;border:2px solid var(--paper);font-variant-numeric:tabular-nums;
}
.count[data-n="0"]{background:rgba(74,36,16,.55)}
.basket.over{transform:scale(1.08) translateY(-4px)}
.basket.over .art{filter:drop-shadow(0 0 14px var(--gold)) drop-shadow(0 6px 5px rgba(74,36,16,.3))}
.basket.ready .art{animation:ready 1s ease-in-out infinite}
@keyframes ready{50%{filter:drop-shadow(0 0 12px var(--gold)) drop-shadow(0 6px 5px rgba(74,36,16,.3))}}
.basket.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{35%{transform:scale(1.12) translateY(-6px)}}
.basket.shake{animation:shake .4s ease}
@keyframes shake{20%{transform:translateX(-8px) rotate(-3deg)}45%{transform:translateX(8px) rotate(3deg)}70%{transform:translateX(-5px)}}
.basket.shake .tag{border-color:var(--berry)}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(74,36,16,.38)}
.card{
  width:100%;max-width:440px;background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:24px 22px;
  box-shadow:0 8px 0 rgba(74,36,16,.35);display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;
}
.card h1,.card h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.05;text-wrap:balance}
.card p{margin:0;font-size:18px;line-height:1.4}
.card .ru{font-size:15px;color:var(--ink-soft)}
.rules{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-family:var(--f-display);font-weight:700;font-size:20px;margin:2px 0}
.rules em{font-style:normal;color:var(--berry);font-weight:700}
.btn{
  font-family:var(--f-display);font-weight:700;font-size:22px;background:var(--leaf);color:#fff;border:3px solid var(--ink);border-radius:16px;
  padding:10px 34px;cursor:pointer;box-shadow:0 4px 0 rgba(74,36,16,.45);margin-top:4px;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,36,16,.45)}
.stars{font-family:var(--f-display);font-size:44px;letter-spacing:.12em;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;line-height:1}
.stars .off{color:rgba(74,36,16,.18)}
.review{font-size:16px}
.review b{font-family:var(--f-display);font-weight:700;color:var(--berry)}

@media (max-width:560px){
  .hud{grid-template-columns:1fr}
  .title{font-size:20px}
  .status{font-size:16px}
  .help{font-size:16px;gap:6px 12px}
}
@media (prefers-reduced-motion:reduce){
  .mush.pop,.basket.ready .art,.basket.bump,.basket.shake{animation:none}
  .mush.returning,.mush.done,.bar i,.basket{transition-duration:.01s;transition-delay:0s}
}
</style>

<div class="scene">
  <div class="wrap">
    <header class="hud">
      <div class="title">Mushroom Baskets</div>
      <div class="progress">
        <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
        <span class="stat"><b id="doneN">0</b> / 16</span>
      </div>
    </header>

    <div class="status-row"><p class="status" id="status" role="status" aria-live="polite">Drag each mushroom to its basket.</p></div>

    <section class="baskets" aria-label="Baskets">
      <button class="basket" data-verb="am" aria-label="Basket: am"><div class="art"></div><span class="tag">am</span><span class="count" data-n="0">0</span></button>
      <button class="basket" data-verb="is" aria-label="Basket: is"><div class="art"></div><span class="tag">is</span><span class="count" data-n="0">0</span></button>
      <button class="basket" data-verb="are" aria-label="Basket: are"><div class="art"></div><span class="tag">are</span><span class="count" data-n="0">0</span></button>
    </section>

    <main class="floor" id="floor" aria-label="Mushrooms"></main>

  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
  </div>
</div>

<script>
(function(){
  var TOTAL = 16, SLOTS = 6;
  var KINDS = ['red','brown','chan'];

  // Subjects (A1). p = the pronoun that stands for the subject.
  var IS_POOL = [
    {t:'He',p:'he'},{t:'She',p:'she'},{t:'It',p:'it'},
    {t:'Tom',p:'he'},{t:'Anna',p:'she'},{t:'My mum',p:'she'},{t:'My dad',p:'he'},
    {t:'My sister',p:'she'},{t:'My brother',p:'he'},
    {t:'The cat',p:'it'},{t:'The dog',p:'it'},{t:'The sun',p:'it'},{t:'Maria',p:'she'},{t:'The bird',p:'it'}
  ];
  var ARE_POOL = [
    {t:'You',p:'you'},{t:'We',p:'we'},{t:'They',p:'they'},
    {t:'My friends',p:'they'},{t:'Tom and Anna',p:'they'},{t:'The dogs',p:'they'},
    {t:'The kids',p:'they'},{t:'My parents',p:'they'},{t:'Mum and Dad',p:'they'},{t:'Tom and I',p:'we'},{t:'The boys',p:'they'},{t:'The girls',p:'they'}
  ];

  var $ = function(id){ return document.getElementById(id); };
  var floor = $('floor'), statusEl = $('status'), overlay = $('overlay'), card = $('card');
  var barFill = $('barFill'), doneN = $('doneN');
  var baskets = {};
  Array.prototype.forEach.call(document.querySelectorAll('.basket'), function(b){ baskets[b.dataset.verb] = b; });
  var slots = [];
  for (var i = 0; i < SLOTS; i++){ var s = document.createElement('div'); s.className = 'slot'; floor.appendChild(s); slots.push(s); }

  var queue = [], done = 0, mistakes = 0, firstTry = 0, selected = null, drag = null, playing = false, review = [];
  var counts = {am:0, is:0, are:0};

  function shuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pick(arr, n){ return shuffle(arr.slice()).slice(0, n); }

  function makeRound(){
    var items = [];
    for (var k = 0; k < 3; k++) items.push({t:'I', p:'I', a:'am'});
    pick(IS_POOL, 7).forEach(function(x){ items.push({t:x.t, p:x.p, a:'is'}); });
    pick(ARE_POOL, 6).forEach(function(x){ items.push({t:x.t, p:x.p, a:'are'}); });
    shuffle(items);
    items.forEach(function(it, i){
      it.k = KINDS[(i + Math.floor(Math.random() * 3)) % 3];
      it.rot = Math.round((Math.random() * 8 - 4) * 10) / 10;
      it.miss = false;
    });
    return items;
  }

  function sizeClass(t){
    var n = t.length;
    return n <= 3 ? 'w1' : n <= 5 ? 'w2' : n <= 8 ? 'w3' : 'w4';
  }

  function say(msg, kind){
    statusEl.textContent = msg;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  /* ---------- sound ---------- */
  var ac = null, soundOn = true;
  function ensureAudio(){
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
  }
  function tone(f, t0, dur, type, vol){
    if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + t0;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  function sfx(kind){
    if (!soundOn) return; ensureAudio(); if (!ac) return;
    try {
      if (kind === 'good'){ tone(660, 0, .12); tone(880, .09, .18); }
      else if (kind === 'bad'){ tone(180, 0, .22, 'triangle', .16); }
      else if (kind === 'win'){ [523, 659, 784, 1047].forEach(function(f, i){ tone(f, i * .12, .25); }); }
    } catch (e) {}
  }

  /* ---------- mushrooms ---------- */
  function buildMush(item){
    var el = document.createElement('div');
    el.className = 'mush pop k-' + item.k;
    el.tabIndex = 0; el.setAttribute('role', 'button');
    el.setAttribute('aria-label', item.t + '. Choose a basket.');
    el.style.setProperty('--rot', item.rot + 'deg');
    el.innerHTML = '<div class="art"></div><span class="word ' + sizeClass(item.t) + '"></span>';
    el.querySelector('.word').textContent = item.t;
    el._item = item;
    el.addEventListener('animationend', function(){ el.classList.remove('pop'); });

    el.addEventListener('pointerdown', function(e){
      if (!playing || el.classList.contains('done')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      ensureAudio();
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      drag = {el: el, id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false};
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', function(e){
      if (!drag || drag.el !== el || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 8) return;
      if (!drag.moved){ drag.moved = true; clearSelection(); }
      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dy', dy + 'px');
      hover(basketAt(e.clientX, e.clientY));
    });
    function finish(e, cancelled){
      if (!drag || drag.el !== el || e.pointerId !== drag.id) return;
      var d = drag; drag = null; hover(null);
      if (!d.moved){ el.classList.remove('dragging'); if (!cancelled) toggleSelect(el); return; }
      var b = cancelled ? null : basketAt(e.clientX, e.clientY);
      if (b) attempt(el, b.dataset.verb, true); else sendBack(el);
    }
    el.addEventListener('pointerup', function(e){ finish(e, false); });
    el.addEventListener('pointercancel', function(e){ finish(e, true); });
    el.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if (playing) toggleSelect(el); }
    });
    return el;
  }

  function place(slot){
    if (!queue.length){ slot.innerHTML = ''; return; }
    slot.innerHTML = '';
    slot.appendChild(buildMush(queue.shift()));
  }

  function basketAt(x, y){
    var best = null, bestD = 1e9, pad = 16;
    Object.keys(baskets).forEach(function(v){
      var r = baskets[v].getBoundingClientRect();
      if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad){
        var d = Math.hypot(x - (r.left + r.width / 2), y - (r.top + r.height / 2));
        if (d < bestD){ bestD = d; best = baskets[v]; }
      }
    });
    return best;
  }
  function hover(b){
    Object.keys(baskets).forEach(function(v){ baskets[v].classList.toggle('over', baskets[v] === b); });
  }

  function clearSelection(){
    if (selected) selected.classList.remove('selected');
    selected = null;
    Object.keys(baskets).forEach(function(v){ baskets[v].classList.remove('ready'); });
  }
  function toggleSelect(el){
    if (selected === el){ clearSelection(); say('Drag each mushroom to its basket.'); return; }
    clearSelection();
    selected = el; el.classList.add('selected');
    Object.keys(baskets).forEach(function(v){ baskets[v].classList.add('ready'); });
    say(el._item.t + ' … tap a basket: am, is or are.');
  }

  function pulse(b, cls){
    b.classList.remove('bump', 'shake'); void b.offsetWidth; b.classList.add(cls);
    setTimeout(function(){ b.classList.remove(cls); }, 450);
  }

  function sendBack(el){
    el.classList.remove('dragging');
    el.classList.add('returning');
    el.style.setProperty('--dx', '0px'); el.style.setProperty('--dy', '0px');
    setTimeout(function(){ el.classList.remove('returning'); }, 420);
  }

  function attempt(el, verb, fromDrag){
    var item = el._item;
    clearSelection();
    if (verb === item.a) correct(el, verb, item); else wrong(el, verb, item, fromDrag);
  }

  function correct(el, verb, item){
    el.classList.remove('dragging');
    el.classList.add('done');
    var b = baskets[verb], br = b.getBoundingClientRect(), er = el.getBoundingClientRect();
    var dx = parseFloat(el.style.getPropertyValue('--dx')) || 0, dy = parseFloat(el.style.getPropertyValue('--dy')) || 0;
    el.style.setProperty('--dx', (dx + br.left + br.width / 2 - (er.left + er.width / 2)) + 'px');
    el.style.setProperty('--dy', (dy + br.top + br.height * .4 - (er.top + er.height / 2)) + 'px');
    el.style.setProperty('--s', '.3');

    done++; counts[verb]++;
    if (!item.miss) firstTry++; else review.push(item);
    var cnt = b.querySelector('.count'); cnt.textContent = counts[verb]; cnt.dataset.n = counts[verb];
    doneN.textContent = done; barFill.style.width = (done / TOTAL * 100) + '%';
    say(item.t + ' ' + item.a + '. ✓', 'good');
    sfx('good');
    setTimeout(function(){ pulse(b, 'bump'); }, 380);

    var slot = el.parentNode;
    setTimeout(function(){
      place(slot);
      if (done === TOTAL) setTimeout(showResult, 300);
    }, 560);
  }

  function wrong(el, verb, item, fromDrag){
    item.miss = true; mistakes++; missN.textContent = mistakes;
    var hint = item.p.toLowerCase() !== item.t.toLowerCase() ? item.t + ' = ' + item.p + '. Try again!' : 'Not yet. Try again!';
    say(hint, 'bad');
    sfx('bad');
    pulse(baskets[verb], 'shake');
    sendBack(el);
  }

  /* ---------- screens ---------- */
  function showStart(){
    card.innerHTML =
      '<h1 id="cardTitle">Mushroom Baskets</h1>' +
      '<p>Put each mushroom in the right basket.</p>' +
      '<div class="rules"><span>am</span><span>is</span><span>are</span></div>' +
      '<button class="btn" id="goBtn">Start</button>';
    overlay.hidden = false;
    $('goBtn').addEventListener('click', function(){ ensureAudio(); overlay.hidden = true; playing = true; });
    $('goBtn').focus({preventScroll:true});
  }

  function showResult(){
    playing = false;
    var stars = mistakes <= 1 ? 3 : mistakes <= 5 ? 2 : 1;
    var s = ''; for (var i = 1; i <= 3; i++) s += i <= stars ? '★' : '<span class="off">★</span>';
    var title = stars === 3 ? 'Great job!' : stars === 2 ? 'Well done!' : 'Good try!';
    var rev = '';
    if (review.length){
      var seen = {}, list = [];
      review.forEach(function(it){ var k = it.t + ' ' + it.a; if (!seen[k]){ seen[k] = 1; list.push('<b>' + escapeHtml(k) + '</b>'); } });
      rev = '<p class="review">Practise: ' + list.join(' · ') + '</p>';
    }
    card.innerHTML =
      '<h2 id="cardTitle">' + title + '</h2>' +
      '<div class="stars" aria-label="' + stars + ' of 3 stars">' + s + '</div>' +
      '<p>First try: <b>' + firstTry + ' / ' + TOTAL + '</b></p>' + rev +
      '<button class="btn" id="againBtn">Play again</button>';
    overlay.hidden = false;
    sfx('win');
    $('againBtn').addEventListener('click', function(){ newGame(); overlay.hidden = true; playing = true; });
    $('againBtn').focus({preventScroll:true});
  }
  function escapeHtml(t){ return t.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function newGame(){
    done = 0; mistakes = 0; firstTry = 0; review = []; counts = {am:0, is:0, are:0}; selected = null; drag = null;
    doneN.textContent = '0'; barFill.style.width = '0';
    Object.keys(baskets).forEach(function(v){
      var c = baskets[v].querySelector('.count'); c.textContent = '0'; c.dataset.n = '0'; baskets[v].classList.remove('ready', 'over');
    });
    queue = makeRound();
    slots.forEach(place);
    say('Drag each mushroom to its basket.');
  }

  /* ---------- controls ---------- */
  Object.keys(baskets).forEach(function(v){
    baskets[v].addEventListener('click', function(){
      if (playing && selected) attempt(selected, v, false);
    });
  });
  document.addEventListener('keydown', function(e){
    if (!playing || !selected) return;
    var map = {'1':'am','2':'is','3':'are'};
    if (map[e.key]) attempt(selected, map[e.key], false);
    else if (e.key === 'Escape'){ clearSelection(); say('Drag each mushroom to its basket.'); }
  });

  newGame();
  playing = true;
})();
</script>
